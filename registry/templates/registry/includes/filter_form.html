{# Универсальная форма фильтрации: параметры передаются GET-запросом. #}
<form class="filter-bar" method="get" action="{{ action }}" novalidate>
  {% for field in form %}
    <label class="filter-field filter-{{ field.name }}">
      <span class="filter-label">{{ field.label }}{% if field.field.required %} *{% endif %}</span>
      {{ field }}
      {% if field.help_text %}<span class="filter-help">{{ field.help_text }}</span>{% endif %}
    </label>
  {% endfor %}
  <button class="btn btn-primary" type="submit">Показать</button>
  {% if request.GET %}<a class="clear-link" href="{{ action }}">Сбросить</a>{% endif %}
</form>
{% if form.errors %}
  <p class="filter-errors">Проверьте параметры фильтра: часть значений не принята, показаны все записи.</p>
{% endif %}
