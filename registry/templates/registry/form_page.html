{% extends 'base.html' %}
{% block title %}{{ title }} — Садовый реестр{% endblock %}
{% block content %}
<section class="page-intro"><p class="eyebrow">РЕЕСТР / ФОРМА</p><h1>{{ title }}</h1><p>{{ intro }}</p></section>
<form class="form-card" method="post" enctype="multipart/form-data" novalidate>
  {% csrf_token %}
  {% include 'registry/includes/form_fields.html' %}
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
    <a class="btn-outline" href="{{ cancel_url }}">Отмена</a>
  </div>
</form>
{% endblock %}
